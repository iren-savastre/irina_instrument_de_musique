
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      # 3307 côté hôte : le 3306 est déjà pris par le MariaDB natif de WSL
      - "3307:3306"
###< doctrine/doctrine-bundle ###

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      - database
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      # 8081 côté hôte : le 8080 est déjà pris par Apache dans WSL
      - "8081:80"

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
